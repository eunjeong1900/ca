name: Monthly DART update
on:
  schedule:
    - cron: '15 16 1 * *' # 01:15 KST on the first day of each month
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'requirements.txt'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect DART reports and analyze
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_CORP_CODE: ${{ secrets.DART_CORP_CODE }}
          COMPANY_NAME: GC메디아이
          START_YEAR: '2010'
        run: python scripts/update.py
      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports docs/data
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m "chore: monthly DART financial data update"
            git push
          fi
